name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install --legacy-peer-deps --registry https://registry.npmjs.org

      - name: Build AAB (EAS Cloud)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_URL=$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if isinstance(data, list): data = data[0]
          print(data.get('artifacts', {}).get('buildUrl', ''))
          ")
          echo "Build URL: $BUILD_URL"
          if [ -n "$BUILD_URL" ]; then
            curl -L "$BUILD_URL" -o build.aab
            echo "Downloaded build.aab"
          else
            echo "No build URL returned – check expo.dev/accounts/campcheck/projects/camp-check/builds"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: camp-check-release
          path: build.aab
          retention-days: 30
