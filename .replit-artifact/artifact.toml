kind = "mobile"
previewPath = "/"
title = "CampCheck"
version = "1.0.0"
id = "artifacts/camp-check"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22101

[services.development]
run = "pnpm --filter @workspace/camp-check run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/camp-check", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/camp-check", "run", "serve" ]

[services.env]
PORT = "22101"
BASE_PATH = "/"
